format_version = 2
owner_plan = "docs/plans/BOON_COMPILER_PERFORMANCE_PLAN.md"
report = "target/reports/compiler-performance/compiler-performance.json"

[protocol]
build_profile = "release"
target_profile = "software_default"
setup_samples = 3
scored_samples = 30
compiler_threads = 1
compiler_caches = "disabled"
cold_modes = ["fresh-process", "empty-session"]
os_page_cache = "natural"
sample_process_isolation = "one-process-per-observation"
peak_rss_unit = "KiB"
peak_rss_scope = "process-high-water-through-compiler-artifact"

[[fixtures]]
id = "counter"
source = "examples/counter.bn"
package_source_lines = 140
compiler_input_source_lines = 140
checked_diagnostics_p95_ms = 10.0
verified_machine_plan_p95_ms = 50.0
peak_rss_mib_max = 32
machine_plan_sha256 = "dc1fe51b659d1746a0b0b4ae2dcba21d50a9426499eb2bde28dbed988e6cfb08"

[[fixtures]]
id = "todo-mvc-physical"
