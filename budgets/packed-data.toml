# Integer baselines below are the first complete measurements of the current
# exact-Number, first-class-Tag, one-based semantic runtime. The pre-flag-day
# predecessor remains identified above and in Git history; it is not comparable
# enough to police the new semantic epoch. Current limits are explicit
# regression ratchets and final limits remain the packed flag-day targets.
# Maxima and minima are never conflated, and generated reports may improve
# without silently learning a new baseline.

[protocol]
name = "boon-phase0-current-runtime-v1"
target_profile = "software_default"
build_profile = "release"
allocator_scope = "All Rust allocations in the single-threaded native producer process; intervals exclude compilation, warmup, JSON serialization, and report I/O unless named otherwise."
allocator_instrumentation_status = "current-runtime-measured"
warmup_status = "current-runtime-measured"
