format_version = 1
protocol = "boon-phase0-current-runtime-v1"
target_profile = "software_default"
build_profile = "release"
allocator_scope = "All Rust allocations in the single-threaded native producer process; intervals exclude compilation, warmup, JSON serialization, and report I/O unless named otherwise."

