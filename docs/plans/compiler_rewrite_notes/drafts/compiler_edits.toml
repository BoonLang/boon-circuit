[[edit]]
class = "add-function"
fixture = "todo-mvc-physical"
unit = "examples/todo_mvc_physical/RUN.bn"
steps = [{ anchor = "FUNCTION delete_button_text() {\n    [\n        font: Theme/font(of: BodyDanger)\n        depth: Theme/depth(of: Detail)\n        move: [further: Theme/elevation(of: TodoItem)]\n    ]\n}\n", insert = "\nFUNCTION probe_double(x) {\n    x * 2\n}\n" }]
restore = true

[[edit]]
class = "paste-block"
fixture = "todo-mvc-physical"
unit = "examples/todo_mvc_physical/RUN.bn"
steps = [{ anchor = "FUNCTION delete_button_text() {\n    [\n        font: Theme/font(of: BodyDanger)\n        depth: Theme/depth(of: Detail)\n        move: [further: Theme/elevation(of: TodoItem)]\n    ]\n}\n", insert = "\nFUNCTION delete_button_text_copy() {\n    [\n        font: Theme/font(of: BodyDanger)\n        depth: Theme/depth(of: Detail)\n        move: [further: Theme/elevation(of: TodoItem)]\n    ]\n}\n" }]
paste = true
undo = true

[[edit]]
class = "type-error-and-fix"    # TEXT - 1 is an error under the strict rules; restore fixes it
fixture = "todo-mvc-physical"
unit = "examples/todo_mvc_physical/RUN.bn"
steps = [{ anchor = "new_todo(title: item.title |> Text/trim()", insert = " - 1" }]
restore = true

[[edit]]
class = "incomplete-syntax"
fixture = "todo-mvc-physical"
unit = "examples/todo_mvc_physical/RUN.bn"
steps = [{ anchor = "    all_completed:\n        active_count == 0 |> Bool/and(right: completed_count > 0)\n", insert = "    probe: has_todos |> WHEN { True => TEXT { yes } False => TEXT { no } }\n" }]
restore = true

