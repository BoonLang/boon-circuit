[package]
name = "boon_semantic"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Compiles the historical occurrence-specialized semantic projection only for
# differential oracle tests. Production compiler/runtime targets never enable
# this feature.
test-flat-oracle = []
# Retains the packed call authority and checked rows only in downstream
# differential tests. Ordinary compiler/runtime builds never enable it.
test-packed-call-oracle = []

[dependencies]
boon_checked.workspace = true
boon_compilation_db.workspace = true
boon_compiler_kernel.workspace = true
boon_contract.workspace = true
boon_data.workspace = true
serde.workspace = true
sha2.workspace = true

[dev-dependencies]
boon_parser.workspace = true
boon_typecheck.workspace = true
toml.workspace = true
