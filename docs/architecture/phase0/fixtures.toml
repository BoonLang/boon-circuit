format_version = 2
harness = "boon_phase0_baseline::fixtures"
dataset_manifest = "docs/architecture/phase0/dataset_fixtures.toml"

# `status = "existing"` means the named executable evidence exists. It does
# not mean a future target feature is implemented. `target_status` and
# `evidence_status` make that distinction machine-readable.

[[fixtures]]
id = "direct-out"
classification = "current-regression"
status = "existing"
target_status = "current-supported"
evidence_status = "compile-execute-current"
owner_phase = "goal-phase-1-verified-spine"
