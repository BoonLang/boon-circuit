[warm]
report = "target/reports/compiler-performance/compiler-interactions.json"
source = "examples/todo_mvc_physical/RUN.bn"
switch_source = "examples/counter.bn"
edit_unit = "examples/todo_mvc_physical/RUN.bn"
edit_from = "TEXT { Walk the dog }"
edit_to = "TEXT { Walk the dogs }"
checked_diagnostics_p95_ms = 16.7
checked_diagnostics_p99_ms = 25.0
checked_diagnostics_max_ms = 33.4
verified_preview_p95_ms = 100.0
verified_preview_max_ms = 200.0
loaded_bundle_lookup_max_ms = 1.0
switch_ack_p95_ms = 16.7
switch_present_p95_ms = 100.0
switch_present_max_ms = 200.0
cancellation_max_ms = 8.0

[scaling]
maximum_doubling_ratio = 2.2
dimensions = [
  "call-depth",
  "call-site-count",
  "contextual-call-site-count",
  "static-branch-count",
  "source-unit-count",
  "dependency-cone-size",
]

[[scaling.workloads]]
id = "call-depth"
intent = "diagnostics"
owning_work_counter = "typecheck-inference-call-visits"
baseline_size = 0
base_size = 32
doubled_size = 64

[[scaling.workloads]]
id = "call-site-count"
intent = "diagnostics"
owning_work_counter = "typecheck-inference-call-visits"
baseline_size = 0
base_size = 32
doubled_size = 64

[[scaling.workloads]]
id = "contextual-call-site-count"
