[[edit]]
class = "local-rename"          # parameter and its one use; unresolved-name states in between
fixture = "todo-mvc-physical"
unit = "examples/todo_mvc_physical/RUN.bn"
steps = [
  { anchor = "FUNCTION clear_button_font(", delete = 7 },
  { anchor = "FUNCTION clear_button_font(", insert = "hot" },
  { anchor = "        line: [underline: ", delete = 7 },
  { anchor = "        line: [underline: ", insert = "hot" },
]
restore = true

[[edit]]
