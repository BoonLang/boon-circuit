restore = true

[[edit]]
class = "remove-field"
fixture = "todo-mvc-physical"
unit = "examples/todo_mvc_physical/RUN.bn"
steps = [{ anchor = "        line: [strike: completed]\n        width: Fill\n        height: Fill\n", delete = 22 }]
