[package]
name = "boon_phase0_baseline"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["producer"]
producer = [
    "dep:boon_compiler",
    "dep:boon_plan",
    "dep:boon_plan_executor",
    "dep:sha2",
]

[dependencies]
boon_contract.workspace = true
boon_compiler = { workspace = true, optional = true }
boon_plan = { workspace = true, optional = true }
boon_plan_executor = { workspace = true, optional = true, features = ["phase0-instrumentation"] }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
toml.workspace = true

[[bin]]
name = "boon_phase0_baseline"
path = "src/main.rs"
required-features = ["producer"]
