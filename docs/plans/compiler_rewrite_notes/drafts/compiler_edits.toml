# budgets/compiler_edits.toml, format 1 (proposal, 2026-09-29, revision 2). Warm edit corpus.
#
# Semantics, per [[edit]]:
# - Each step finds the unique `anchor` in `unit` (the run fails fast if it is absent
#   or not unique), then types `insert` one character per revision right after the
#   anchor, or deletes `delete` characters after the anchor one per revision.
#   Steps run in order; a later step sees the text produced by earlier steps.
# - `paste = true`: the whole insert is one revision (clipboard paste).
# - `undo = true`: after the steps, one extra revision restores the text from
#   before the edit in a single jump (editor undo); measured as its own class.
# - `restore = true`: after the steps (and undo, if any), the inverse is typed
#   one character per revision, so the session ends on the original text.
# - Every revision goes through the product compile service. The final revision
#   of each edit (before restore) is also compiled cold and compared with the warm
#   result (normalized diagnostics and canonical plan identity).
# Anchors move when examples are refactored; update them in the same commit.
# Removing a class or an edit needs the owner's approval (budgets/compiler.toml policy).

format_version = 1
required_classes = [
  "literal-text", "literal-number", "whitespace", "comment",
  "local-rename", "add-field", "remove-field", "add-function",
  "type-error-and-fix", "incomplete-syntax", "cross-unit", "cross-unit-type-change",
  "undo-to-previous", "paste-block", "migration-stage", "child-program",
]

# ----------------------------------------------------------------- TodoMVC

[[edit]]
class = "literal-text"
fixture = "todo-mvc-physical"
unit = "examples/todo_mvc_physical/RUN.bn"
steps = [{ anchor = "TEXT { Walk the dog", insert = "s and the cat" }]
restore = true

[[edit]]
