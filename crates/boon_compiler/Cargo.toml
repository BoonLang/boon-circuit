[package]
name = "boon_compiler"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Enables the bounded differential producer used by artifact-oracle tests. It
# is absent from ordinary compiler binaries and cannot become a runtime
# fallback.
test-flat-oracle = ["boon_semantic/test-flat-oracle"]

[dependencies]
boon_checked.workspace = true
boon_data.workspace = true
boon_example_manifest.workspace = true
boon_ir.workspace = true
boon_parser.workspace = true
boon_plan.workspace = true
boon_semantic.workspace = true
boon_syntax.workspace = true
boon_typecheck.workspace = true
boon_verify.workspace = true
serde.workspace = true
sha2.workspace = true
toml.workspace = true
unicode-segmentation.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time.workspace = true

[dev-dependencies]
boon_document.workspace = true
boon_plan_executor.workspace = true

[[test]]
name = "artifact_oracle"
path = "tests/artifact_oracle.rs"
required-features = ["test-flat-oracle"]
